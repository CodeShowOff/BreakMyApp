[project]
name = "breakmyapp"
version = "0.1.0"
description = "BreakMyApp Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "temporalio>=1.6.0",
    "boto3>=1.34.131",
    "openai>=1.35.3",
    "playwright>=1.44.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
